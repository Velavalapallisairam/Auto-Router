<svg xmlns="http://www.w3.org/2000/svg" width="120" height="124" viewBox="0 0 120 124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><defs><radialGradient id="b" cx=".33" cy=".25" r=".9"><stop offset="0" stop-color="#8fd0ff"/><stop offset=".52" stop-color="#0a84ff"/><stop offset="1" stop-color="#0450a8"/></radialGradient><radialGradient id="k" cx=".35" cy=".2" r=".95"><stop offset="0" stop-color="#fff0b8"/><stop offset=".52" stop-color="#f5b301"/><stop offset="1" stop-color="#a86c00"/></radialGradient><radialGradient id="h"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><radialGradient id="f"><stop offset="0" stop-color="#000" stop-opacity=".4"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient><radialGradient id="a"><stop offset=".35" stop-color="#0a84ff" stop-opacity=".42"/><stop offset="1" stop-color="#0a84ff" stop-opacity="0"/></radialGradient><linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0ff"/><stop offset=".3" stop-color="#0a84ff"/><stop offset="1" stop-color="#0450a8"/></linearGradient></defs><style>.e,.l,.eye,.sh,.glow,.spark{transform-box:fill-box}.e,.l{transform-origin:50% 100%}.eye,.sh,.glow,.spark{transform-origin:center}.e-asleep{opacity:.5;animation:settle .9s cubic-bezier(.22,1,.36,1) both}.e-waking{opacity:.82;animation:stir .8s cubic-bezier(.22,1,.36,1) both}.e-awake{animation:rise .7s cubic-bezier(.22,1,.36,1) both}.e-unavailable{opacity:.55}.breathe{animation:breathe 4.8s ease-in-out .9s infinite}.sway{animation:sway 3.4s ease-in-out .8s infinite}.bob{animation:bob 2.8s ease-in-out .7s infinite}.sh-awake{animation:shade 2.8s ease-in-out .7s infinite}.open{animation:open .5s ease-out .15s both}.blink{animation:blink 4.6s 1.2s infinite}.fade{animation:fade .8s ease-out both}.glow{animation:glow 3.2s ease-in-out infinite}.z{opacity:0;animation:z 4.2s ease-in-out .9s infinite}.z2{animation-delay:2.3s}.z3{