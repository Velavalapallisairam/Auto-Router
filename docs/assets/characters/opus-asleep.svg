<svg xmlns="http://www.w3.org/2000/svg" width="120" height="124" viewBox="0 0 120 124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><defs><radialGradient id="b" cx=".33" cy=".25" r=".9"><stop offset="0" stop-color="#e2b4fa"/><stop offset=".52" stop-color="#af52de"/><stop offset="1" stop-color="#6d219c"/></radialGradient><radialGradient id="k" cx=".35" cy=".2" r=".95"><stop offset="0" stop-color="#fff0b8"/><stop offset=".52" stop-color="#f5b301"/><stop offset="1" stop-color="#a86c00"/></radialGradient><radialGradient id="h"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><radialGradient id="f"><stop offset="0" stop-color="#000" stop-opacity=".4"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient><radialGradient id="a"><stop offset=".35" stop-color="#af52de" stop-opacity=".42"/><stop offset="1" stop-color="#af52de" stop-opacity="0"/></radialGradient><linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2b4fa"/><stop offset=".3" stop-color="#af52de"/><stop offset="1" stop-color="#6d219c"/></linearGradient></defs><style>.e,.l,.eye,.sh,.glow,.spark{transform-box:fill-box}.e,.l{transform-origin:50% 100%}.eye,.sh,.glow,.spark{transform-origin:center}.e-asleep{opacity:.5;animation:settle .9s cubic-bezier(.22,1,.36,1) both}.e-waking{opacity:.82;animation:stir .8s cubic-bezier(.22,1,.36,1) both}.e-awake{animation:rise .7s cubic-bezier(.22,1,.36,1) both}.e-unavailable{opacity:.55}.breathe{animation:breathe 4.8s ease-in-out .9s infinite}.sway{animation:sway 3.4s ease-in-out .8s infinite}.bob{animation:bob 2.8s ease-in-out .7s infinite}.sh-awake{animation:shade 2.8s ease-in-out .7s infinite}.open{animation:open .5s ease-out .15s both}.blink{animation:blink 4.6s 1.2s infinite}.fade{animation:fade .8s ease-out both}.glow{animation:glow 3.2s ease-in-out infinite}.z{opacity:0;animation:z 4.2s ease-in-out .9s infinite}.z2{animation-delay:2.3s}.z3{animation-delay:3.7s}.spark{opacity:0;animation:spark 2s ease-in-out .7s infinite}.s2{animation-delay:1.7s}@keyframes settle{from{opacity:.95;transform:translateY(-2px) scale(1.02)}}@keyframes stir{from{opacity:.5;transform:scale(1.015,.97)}}@keyframes rise{from{opacity:.82;transform:translateY(2px) scale(.98,.96)}}@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.965)}}@keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes shade{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.88);opacity:.75}}@keyframes open{from{transform:scaleY(.15)}}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}@keyframes fade{from{opacity:0}}@keyframes glow{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:.95;transform:scale(1.04)}}@keyframes z{0%{opacity:0;transform:translate(0,0)}35%{opacity:.9}100%{opacity:0;transform:translate(5px,-12px)}}@keyframes spark{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.z{opacity:.7}}</style><g transform="translate(60,54)"><ellipse class="sh" cy="31" rx="25" ry="4.6" fill="url(#f)"/><g class="e e-asleep"><g class="l breathe"><circle cx="-17" cy="-15" r="8.5" fill="url(#b)"/><circle cx="17" cy="-15" r="8.5" fill="url(#b)"/><circle cx="-17" cy="-15" r="4.4" fill="#e2b4fa" opacity=".6"/><circle cx="17" cy="-15" r="4.4" fill="#e2b4fa" opacity=".6"/><ellipse cx="-10" cy="27" rx="7.5" ry="3.6" fill="#6d219c"/><ellipse cx="10" cy="27" rx="7.5" ry="3.6" fill="#6d219c"/><ellipse cx="-24" cy="12" rx="5" ry="7.5" fill="url(#b)"/><ellipse cx="24" cy="12" rx="5" ry="7.5" fill="url(#b)"/><circle cy="4" r="24" fill="url(#b)"/><ellipse cy="11" rx="11.5" ry="8.5" fill="#e2b4fa" opacity=".48"/><ellipse cy="7" rx="3.2" ry="2.1" fill="#2b1140"/><ellipse cx="-.8" cy="6.4" rx="1" ry=".6" fill="#fff" opacit