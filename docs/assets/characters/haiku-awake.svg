<svg xmlns="http://www.w3.org/2000/svg" width="120" height="124" viewBox="0 0 120 124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"><defs><radialGradient id="b" cx=".33" cy=".25" r=".9"><stop offset="0" stop-color="#a8f5b8"/><stop offset=".52" stop-color="#34c759"/><stop offset="1" stop-color="#14803a"/></radialGradient><radialGradient id="k" cx=".35" cy=".2" r=".95"><stop offset="0" stop-color="#fff0b8"/><stop offset=".52" stop-color="#f5b301"/><stop offset="1" stop-color="#a86c00"/></radialGradient><radialGradient id="h"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><radialGradient id="f"><stop offset="0" stop-color="#000" stop-opacity=".4"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient><radialGradient id="a"><stop offset=".35" stop-color="#34c759" stop-opacity=".42"/><stop offset="1" stop-color="#34c759" stop-opacity="0"/></radialGradient><linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8f5b8"/><stop offset=".3" stop-color="#34c759"/><stop offset="1" stop-color="#14803a"/></linearGradient></defs><style>.e,.l,.eye,.sh,.glow,.spark{transform-box:fill-box}.e,.l{transform-origin:50% 100%}.eye,.sh,.glow,.spark{transform-origin:center}.e-asleep{opacity:.5;animation:settle .9s cubic-bezier(.22,1,.36,1) both}.e-waking{opacity:.82;animation:stir .8s cubic-bezier(.22,1,.36,1) both}.e-awake{animation:rise .7s cubic-bezier(.22,1,.36,1) both}.e-unavailable{opacity:.55}.breathe{animation:breathe 4.8s ease-in-out .9s infinite}.sway{animation:sway 3.4s ease-in-out .8s infinite}.bob{animation:bob 2.8s ease-in-out .7s infinite}.sh-awake{animation:shade 2.8s ease-in-out .7s infinite}.open{animation:open .5s ease-out .15s both}.blink{animation:blink 4.6s 1.2s infinite}.fade{animation:fade .8s ease-out both}.glow{animation:glow 3.2s ease-in-out infinite}.z{opacity:0;animation:z 4.2s ease-in-out .9s infinite}.z2{animation-delay:2.3s}.z3{animation-delay:3.7s}.spark{opacity:0;animation:spark 2s ease-in-out .7s infinite}.s2{animation-delay:1.7s}@keyframes settle{from{opacity:.95;transform:translateY(-2px) scale(1.02)}}@keyframes stir{from{opacity:.5;transform:scale(1.015,.97)}}@keyframes rise{from{opacity:.82;transform:translateY(2px) scale(.98,.96)}}@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.965)}}@keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes shade{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.88);opacity:.75}}@keyframes open{from{transform:scaleY(.15)}}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}@keyframes fade{from{opacity:0}}@keyframes glow{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:.95;transform:scale(1.04)}}@keyframes z{0%{opacity:0;transform:translate(0,0)}35%{opacity:.9}100%{opacity:0;transform:translate(5px,-12px)}}@keyframes spark{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.z{opacity:.7}}</style><g transform="translate(60,54)"><g class="fade"><circle class="glow" cy="2" r="44" fill="url(#a)"/></g><ellipse class="sh sh-awake" cy="31" rx="17" ry="4.6" fill="url(#f)"/><g class="e e-awake"><g class="l bob"><path d="M0,-10 C-1,-17 2,-22 7,-25" stroke="#14803a" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M6,-25 C10,-33 20,-33 23,-30 C21,-22 13,-19 6,-25Z" fill="url(#b)"/><path d="M8,-25 Q15,-28 21,-30" stroke="#a8f5b8" stroke-width=".8" fill="none" opacity=".75"/><path d="M1,-17 C-5,-22 -12,-20 -13,-17 C-10,-13 -4,-13 1,-17Z" fill="url(#b)"/><ellipse cx="-8" cy="21" rx="6" ry="3.2" fill="#14803a"/><ellipse cx="8" cy="21" rx="6" ry="3.2" fill="#14803a"/><circle cy="5" r="17" fill="url(#b)"/><ellipse cy="11" rx="10" ry="8" fill="#a8f5b8" opacity=".3"/><circle cx="-11" cy="9" r="2.6" fill="#ff8fa3" opacity=".5"/><circle cx="11" cy="9" r="2.6" fill="#ff8fa3" opacity=".5"/><ellipse cx="-7" cy="-5" rx="6.5" ry="3.6" fill="url(#h)" transform="rotate(-28 -7 -5)"/><g class="eye open"><g class="eye blink"><circle cx="-6" cy="3" r="3.6" fill="#fff"/><circle cx="-5.3" cy="3.4" r="1.8" fill="#1c1c1e"/><circle cx="-6.6" cy="2.1" r="0.8" fill="#fff"/><circle cx="6" cy="3" r="3.6" fill="#fff"/><circle cx="6.7" cy="3.4" r="1.8" fill="#1c1c1e"/><circle cx="5.4" cy="2.1" r="0.8" fill="#fff"/></g></g><path d="M-5,11 q5,4.5 10,0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></g></g><circle class="spark" cx="-36" cy="-20" r="2.2" fill="#a8f5b8"/><circle class="spark s2" cx="37" cy="-16" r="1.8" fill="#a8f5b8"/><rect x="-28" y="42" width="56" height="19" rx="9.5" fill="url(#p)" opacity="1"/><rect x="-24" y="43.5" width="48" height="6" rx="3" fill="#fff" opacity=".18"/><text y="55.5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#fff">Haiku</text></g></svg>